name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Create Flutter project skeleton
        run: flutter create --org com.rpg.gladiator --project-name rpggame_app /tmp/rpggame_build

      - name: Copy our source code into skeleton
        run: |
          cp -r rpggame_app/lib /tmp/rpggame_build/
          cp rpggame_app/pubspec.yaml /tmp/rpggame_build/pubspec.yaml

      - name: Get dependencies
        working-directory: /tmp/rpggame_build
        run: flutter pub get

      - name: Build APK (release)
        working-directory: /tmp/rpggame_build
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gladiator-uprising-apk
          path: /tmp/rpggame_build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
